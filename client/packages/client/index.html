<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0C0A1A" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/web/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/web/android-chrome-512x512.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PLG Voice" />
    <meta property="og:description" content="Голосовой и текстовый мессенджер для геймеров — бесплатные серверы, каналы и HD-голос" />
    <meta property="og:image" content="https://plgames-voice.ru/assets/web/og-preview.png" />
    <meta property="og:url" content="https://plgames-voice.ru" />
    <meta property="og:site_name" content="PLG Voice" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PLG Voice" />
    <meta name="twitter:description" content="Голосовой и текстовый мессенджер для геймеров" />
    <meta name="twitter:image" content="https://plgames-voice.ru/assets/web/og-preview.png" />

    <meta name="description" content="PLG Voice — голосовой и текстовый мессенджер для геймеров. Бесплатные серверы, каналы и HD-голос." />

    <link
      rel="shortcut icon"
      type="image/png"
      href="./public/assets/web/icon.ico"
    />
    <title>PLG Voice</title>
    <style>
      body { margin: 0; background: #0C0A1A; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 24px;
        background: radial-gradient(ellipse at 30% 20%, rgba(124,58,237,0.08) 0%, transparent 50%),
                    radial-gradient(ellipse at 70% 80%, rgba(37,99,235,0.06) 0%, transparent 50%),
                    #0C0A1A;
        font-family: Inter, system-ui, sans-serif;
        transition: opacity 0.4s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash svg { animation: splashPulse 2s ease-in-out infinite; }
      #splash .splash-text {
        color: #A098B8; font-size: 14px; font-weight: 500; letter-spacing: 2px;
        text-transform: uppercase;
      }
      #splash .splash-bar {
        width: 120px; height: 2px; border-radius: 1px;
        background: #231F33; overflow: hidden;
      }
      #splash .splash-bar::after {
        content: ''; display: block; width: 40%; height: 100%;
        background: linear-gradient(90deg, #7C3AED, #2563EB);
        border-radius: 1px;
        animation: splashLoad 1.5s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes splashLoad {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(200%); }
        100% { transform: translateX(-100%); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg width="56" height="56" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 2 L28 9 L28 23 L16 30 L4 23 L4 9 Z" fill="url(#sg)" opacity="0.9"/>
        <path d="M16 10 L16 22 M11 13 L16 10 L21 13 M11 19 L16 22 L21 19" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <defs><linearGradient id="sg" x1="4" y1="2" x2="28" y2="30"><stop offset="0%" stop-color="#7C3AED"/><stop offset="100%" stop-color="#2563EB"/></linearGradient></defs>
      </svg>
      <div class="splash-text">PLG Voice</div>
      <div class="splash-bar"></div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="floating"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
