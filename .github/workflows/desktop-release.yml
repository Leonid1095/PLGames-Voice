name: Desktop Release

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs['desktop--release_created'] || steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs['desktop--tag_name'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: desktop/release-please-config.json
          manifest-file: desktop/.release-please-manifest.json

  publish-release:
    name: Publish Windows App
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout assets
        working-directory: desktop
        run: git -c submodule."assets".update=checkout submodule update --init assets

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Publish
        run: pnpm run publish
        env:
          PLATFORM: windows-latest
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
