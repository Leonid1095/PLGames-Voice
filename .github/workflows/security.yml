name: "CI"

# Runs the secrets-scan test suite (tests/security/) and the bot ESLint check
# on every push to the main branches and on pull requests. The secrets scan is
# the regression net that stops secrets from being re-introduced into tracked
# files — the same test that caught the history leak during the 2026-07-31 audit.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git ls-files` inside the test works and a future
          # history-aware scan (gitleaks/trufflehog) can be bolted on.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests

      - name: Run security tests
        run: tests/node_modules/.bin/vitest run --config tests/vitest.config.ts tests/security/

  bot-lint:
    name: Bot lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: bot
      - name: Lint
        run: npm run lint
        working-directory: bot
      - name: Test
        run: npm test
        working-directory: bot

  desktop:
    name: Desktop typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action reads the pnpm version from packageManager, and the one that
      # applies here lives in desktop/package.json — the repo root has no such
      # field, so without this it fails with "Multiple versions of pnpm
      # specified"/"no version specified".
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: desktop
      # Meaningful only since typescript went 4.5.5 -> 5.9.3: on 4.5 tsc could
      # not even parse @types/node 24 and drowned in 1619 errors inside
      # node_modules, so nothing in src/ was ever actually checked.
      - name: Typecheck
        run: pnpm typecheck
        working-directory: desktop
      - name: Test
        run: pnpm test
        working-directory: desktop

  # Dependency advisories.
  #
  # The Rust job BLOCKS. Its backlog is cleared: the 2026-08-09 audit was the
  # first time this tree had ever been scanned, found 18 vulnerabilities, and
  # every one is now either fixed (jxl-oxide, crossbeam-epoch) or ignored in
  # .cargo/audit.toml with a written reason and a named re-check trigger. The
  # job passes today, so from here a new advisory is a build failure rather
  # than a line in a report nobody reads.
  #
  # The npm job is still informational: client/ carries 6 findings in the
  # build-time lingui/babel chain, none reachable from anything users touch.
  # Flip it once that chain is bumped.
  cargo-audit:
    name: Rust advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins 1.92; cargo-audit needs >= 1.88 to parse the
      # current advisory DB at all (CVSS 4.0 entries).
      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-v0.22
      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit
        working-directory: server

  npm-audit:
    name: npm advisories (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than read from a packageManager field: this job audits
      # both workspaces and they pin different pnpm versions (client 10.28.1,
      # desktop 10.18.1). `pnpm audit` does not care which one reads the lock.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # --prod only: the dev tree is eslint/vitest/vite/rollup/babel and its
      # findings are not reachable from anything users touch.
      #
      # continue-on-error per step, not just per job: pnpm audit exits non-zero
      # when it finds anything, so the client's 6 build-time findings were
      # ending the job before the desktop step ever ran. Both need to report.
      - name: Audit client
        run: pnpm audit --prod
        working-directory: client
        continue-on-error: true
      - name: Audit desktop
        run: pnpm audit --prod
        working-directory: desktop
        continue-on-error: true
