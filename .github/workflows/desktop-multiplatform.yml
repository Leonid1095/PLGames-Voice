name: Desktop Multi-Platform Build

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            make_targets: squirrel zip
          - os: ubuntu-latest
            platform: linux
            make_targets: deb zip
          - os: macos-latest
            platform: darwin
            make_targets: dmg zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout assets
        working-directory: desktop
        run: git -c submodule."assets".update=checkout submodule update --init assets
        continue-on-error: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: desktop/package.json

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run make
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            desktop/out/make/**/*.exe
            desktop/out/make/**/*.deb
            desktop/out/make/**/*.dmg
            desktop/out/make/**/*.zip
            desktop/out/make/**/*.AppImage
          if-no-files-found: warn
