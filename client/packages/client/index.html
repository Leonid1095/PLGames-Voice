<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0B0A12" />
    <link rel="apple-touch-icon" sizes="192x192" href="/assets/web/android-chrome-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/web/android-chrome-512x512.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PLG Voice" />
    <meta property="og:description" content="Голосовой и текстовый мессенджер для геймеров — бесплатные серверы, каналы и HD-голос" />
    <meta property="og:image" content="https://plgames-voice.ru/assets/web/og-preview.png" />
    <meta property="og:url" content="https://plgames-voice.ru" />
    <meta property="og:site_name" content="PLG Voice" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PLG Voice" />
    <meta name="twitter:description" content="Голосовой и текстовый мессенджер для геймеров" />
    <meta name="twitter:image" content="https://plgames-voice.ru/assets/web/og-preview.png" />

    <meta name="description" content="PLG Voice — голосовой и текстовый мессенджер для геймеров. Бесплатные серверы, каналы и HD-голос." />

    <link
      rel="shortcut icon"
      type="image/png"
      href="./public/assets/web/icon.ico"
    />
    <title>PLG Voice</title>
    <style>
      /* Inline boot styles — Полдень.
         Literal values on purpose: this runs before SolidJS hydrates the
         theme, so it cannot read --md-sys-color-*. Paper rather than ink,
         because light is the default; a dark flash on the way into a light
         client is more jarring than no transition at all. */
      html, body { margin: 0; background: #FBF9F7; color: #16131C; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 22px;
        background: #FBF9F7;
        font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system,
                     system-ui, sans-serif;
        transition: opacity 0.32s cubic-bezier(0.2, 0, 0, 1);
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .splash-text {
        font-family: "Bahnschrift", "DIN Alternate", "SF Compact Display",
                     "Arial Narrow", sans-serif;
        font-variation-settings: "wght" 700, "wdth" 75;
        color: #16131C; font-size: 15px; font-weight: 700;
        letter-spacing: 0.1em; text-transform: uppercase;
      }
      /* The signature meter, not a progress bar: the same amplitude bars that
         mark a speaking user everywhere else in the app. One idea carried
         from the very first frame. */
      #splash .splash-meter {
        display: flex; align-items: flex-end; gap: 4px; height: 26px;
      }
      #splash .splash-meter i {
        display: block; width: 4px; height: 28%; border-radius: 2px;
        background: #E00A45;
        animation: splashAmp 1.05s ease-in-out infinite;
      }
      #splash .splash-meter i:nth-child(1) { animation-delay: -0.90s; }
      #splash .splash-meter i:nth-child(2) { animation-delay: -0.50s; }
      #splash .splash-meter i:nth-child(3) { animation-delay: -0.20s; }
      #splash .splash-meter i:nth-child(4) { animation-delay: -0.70s; }
      #splash .splash-meter i:nth-child(5) { animation-delay: -0.35s; }
      @keyframes splashAmp {
        0%, 100% { height: 22%; }
        50%      { height: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-meter i { animation: none; height: 62%; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <svg width="52" height="52" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M16 2 L28 9 L28 23 L16 30 L4 23 L4 9 Z" fill="#E00A45"/>
        <path d="M16 10 L16 22 M11 13 L16 10 L21 13 M11 19 L16 22 L21 19" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="splash-text">PLG Voice</div>
      <div class="splash-meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <div id="floating"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
