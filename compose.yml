name: plg-voice

# Default JSON log driver with rotation — prevents container logs from filling disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Default Linux hardening applied to every service. `no-new-privileges` blocks
# setuid/file-capability escalation (note: this also neutralises the
# cap_net_bind_service xattr on the caddy binary, so caddy gets that cap back
# via cap_add instead). `cap_drop: ALL` strips the default Docker capability
# set; services that genuinely need a cap (caddy: NET_BIND_SERVICE,
# livekit-egress: SYS_ADMIN) re-add only that one.
x-hardening: &default-hardening
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

networks:
  # Edge network: services reached by the host reverse proxy (nginx) and the
  # internal Caddy proxy. Data stores are NOT on this network, so a compromise
  # of web/caddy/bot/january cannot reach mongo/redis/rabbit/minio directly.
  #
  # Subnet is pinned on purpose. With the built-in 172.17-172.31 pool exhausted by
  # other projects, Docker fell through to 192.168.0.0/16 and handed this network
  # 192.168.16.0/20 — which swallowed the admin's LAN gateway 192.168.31.1 and cut
  # SSH access to the host (2026-08-01). Keep it inside the host-wide
  # default-address-pools range (10.192.0.0/12) declared in /etc/docker/daemon.json.
  frontend:
    ipam:
      config:
        - subnet: 10.201.0.0/24
  # Internal network: data stores and the services that talk to them. Not
  # marked `internal: true` because pushd needs outbound internet for push
  # delivery, and ingress/egress may need to reach external stream sources.
  backend:

services:
  # MongoDB: Database
  database:
    image: docker.io/mongo:8
    logging: *default-logging
    <<: *default-hardening
    restart: always
    command: --auth
    user: "999:999"
    volumes:
      - ./data/db:/data/db
    environment:
      MONGO_USER: ${MONGO_USER:-plgadmin}
      MONGO_PASS: ${MONGO_PASS:?Set MONGO_PASS in .env}
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: mongosh --norc --quiet -u $${MONGO_USER} -p $${MONGO_PASS} --authenticationDatabase admin --eval "db.runCommand({ping:1}).ok"
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis: Event message broker & KV store
  redis:
    image: docker.io/redis:7-alpine
    logging: *default-logging
    <<: *default-hardening
    # Run directly as the image's redis user. The entrypoint's root path does
    # `chown`+`su-exec`, which needs CHOWN/DAC_OVERRIDE/SETUID — all stripped by
    # cap_drop: ALL, so it died with "find: ./appendonlydir: Permission denied".
    # Starting as 999:1000 skips that path entirely (and never runs as root).
    user: "999:1000"
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --tcp-keepalive 60
      --timeout 0
      --hz 10
      --tcp-backlog 511
      --activedefrag yes
      --save 3600 1
      --save 900 100
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --client-output-buffer-limit pubsub 67108864 33554432 120
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      # Persist RDB + AOF across container recreation. Without this the
      # --appendonly/--save persistence has nowhere to write and every restart
      # wipes redis (cache/pubsub/presence).
      - ./data/redis:/data
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # RabbitMQ: Internal message broker
  rabbit:
    image: docker.io/rabbitmq:4
    logging: *default-logging
    <<: *default-hardening
    # Same reason as redis: the entrypoint's `gosu rabbitmq` needs CAP_SETUID,
    # which cap_drop: ALL removes ("failed switching to rabbitmq: operation not
    # permitted"). ./data/rabbit is already owned by 999:999.
    user: "999:999"
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-rabbituser}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:?Set RABBIT_PASS in .env}
    volumes:
      - ./data/rabbit:/var/lib/rabbitmq
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MinIO: S3-compatible storage server
  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    logging: *default-logging
    <<: *default-hardening
    command: server /data
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioautumn}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:?Set MINIO_PASS in .env}
      MINIO_DOMAIN: minio
    networks:
      backend:
        aliases:
          - revolt-uploads.minio
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  # Caddy: Web server
  caddy:
    image: docker.io/caddy:2
    logging: *default-logging
    <<: *default-hardening
    # Caddy binds :80 inside the container. Its binary carries the
    # cap_net_bind_service file capability, but `no-new-privileges` neutralises
    # file caps on exec — so grant the cap directly here instead.
    cap_add:
      - NET_BIND_SERVICE
    restart: always
    # Caddy has no depends_on originally, so on `up -d --build` it came up
    # before the Rust services finished init (events connects to Mongo/Redis).
    # Docker DNS then returned SERVFAIL for `events` -> /ws got 502 for the
    # ~8 min until events went healthy. Wait for the proxied upstreams instead.
    # autumn/january are distroless (no healthcheck) -> service_started only.
    # livekit/voice-ingress left out so a slow voice stack never blocks the
    # main web/api/events frontend from serving.
    depends_on:
      api:
        condition: service_healthy
      events:
        condition: service_healthy
      web:
        condition: service_healthy
      autumn:
        condition: service_started
      january:
        condition: service_started
    env_file: .env.web
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
    networks: [frontend]
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # API server (local build with forum/threads support)
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    image: plg-voice-api:latest
    logging: *default-logging
    <<: *default-hardening
    # Revolt.toml is 0640 uid1000:65532 on the host. The container runs as
    # 65532:65532 (USER in Dockerfile.api), so it reads the config via primary
    # group membership — no CAP_DAC_OVERRIDE. group_add kept for clarity.
    # History: cap_drop: ALL removed CAP_DAC_OVERRIDE -> panic at
    # crates/core/config/src/lib.rs:112 "Permission denied" (back when this ran as root).
    group_add: ["65532"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    networks: [frontend, backend]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/14702' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

  # Events service (local build)
  events:
    build:
      context: ./server
      dockerfile: Dockerfile.events
    image: plg-voice-events:latest
    logging: *default-logging
    <<: *default-hardening
    # Same as api: runs as 65532:65532 (USER in Dockerfile.events), reads the
    # 0640 uid1000:65532 Revolt.toml via group membership.
    group_add: ["65532"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    networks: [frontend, backend]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/14703' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

  # File server
  autumn:
    # Was plg-voice-autumn:latest — a local re-tag from the 2b974f28 "image
    # rebrand" with no build behind it. The tag is long gone, so the service
    # could not be recreated; it survived only because its container predates
    # the tag's removal. Point at the image it is actually running.
    image: ghcr.io/stoatchat/file-server:latest
    logging: *default-logging
    <<: *default-hardening
    depends_on:
      database:
        condition: service_healthy
      createbuckets:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    networks: [frontend, backend]
    deploy:
      resources:
        limits:
          memory: 512M
    # No healthcheck: this image is distroless — it has no /bin/sh, no bash and
    # no wget, so every CMD-SHELL probe fails with "stat /bin/sh: no such file
    # or directory" and marks a perfectly healthy service unhealthy. The
    # previous `bash -c '</dev/tcp/...'` check had simply never run, because the
    # container long predated it. Nothing depends on this service's health
    # condition; liveness is covered by the reverse proxy.
    restart: always

  # Metadata and image proxy
  january:
    image: ghcr.io/stoatchat/proxy:latest
    logging: *default-logging
    <<: *default-hardening
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    networks: [frontend]
    deploy:
      resources:
        limits:
          memory: 256M
    # No healthcheck — distroless image, same as autumn above.
    restart: always

  # Regular task daemon
  crond:
    image: ghcr.io/stoatchat/crond:latest
    logging: *default-logging
    <<: *default-hardening
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always

  # Push notification daemon
  pushd:
    image: ghcr.io/stoatchat/pushd:latest
    logging: *default-logging
    <<: *default-hardening
    restart: always
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 256M

  # Voice ingress daemon
  voice-ingress:
    image: ghcr.io/stoatchat/voice-ingress:latest
    logging: *default-logging
    <<: *default-hardening
    restart: always
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    networks: [frontend, backend]
    deploy:
      resources:
        limits:
          memory: 256M

  # Voice server
  livekit:
    image: ghcr.io/stoatchat/livekit-server:v1.9.6
    logging: *default-logging
    <<: *default-hardening
    command: --config /etc/livekit.yml
    volumes:
      - ./livekit.yml:/etc/livekit.yml:ro
      - ./data/livekit-certs/fullchain.pem:/etc/livekit/fullchain.pem:ro
      - ./data/livekit-certs/privkey.pem:/etc/livekit/privkey.pem:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "50000-50100:50000-50100/udp"
    networks: [frontend, backend]
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  # LiveKit Ingress: RTMP/WHIP streaming (OBS etc.)
  livekit-ingress:
    image: livekit/ingress:v1.4.3
    logging: *default-logging
    <<: *default-hardening
    restart: always
    # Same fix as livekit-egress: short-form depends_on is service_started, which
    # raced Docker DNS and crash-looped (11 restarts). Wait for healthy upstreams.
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress.yml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
    volumes:
      - ./ingress.yml:/etc/ingress.yml:ro
    ports:
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8088:8088"
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 512M

  # LiveKit Egress: stream recording
  livekit-egress:
    image: livekit/egress:v1.12.0
    logging: *default-logging
    <<: *default-hardening
    restart: always
    # Long form, not the short list: the short form is service_started, so egress
    # launched the moment the redis *container* existed — before Docker DNS was
    # ready, it got `lookup redis ... server misbehaving` and crash-looped
    # (11 restarts observed). Wait for redis + livekit to be actually healthy.
    depends_on:
      livekit:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
    volumes:
      - ./egress.yml:/etc/egress.yml:ro
      - ./data/recordings:/recordings
    cap_add:
      - SYS_ADMIN
    networks: [backend]
    deploy:
      resources:
        limits:
          memory: 1G

  # Create buckets for minio.
  createbuckets:
    # NB: mc has its own release cadence. RELEASE.2025-09-07T16-13-09Z was the
    # minio *server* tag copied across, and never existed for mc — so this
    # init container could not start, and with it neither could autumn.
    image: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    logging: *default-logging
    <<: *default-hardening
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc ready minio; do
        /usr/bin/mc alias set minio http://minio:9000 $${MINIO_USER:-minioautumn} $${MINIO_PASS};
        echo 'Waiting minio...' && sleep 1;
      done;
      /usr/bin/mc mb minio/revolt-uploads;
      exit 0;
      "
    environment:
      MINIO_USER: ${MINIO_USER:-minioautumn}
      MINIO_PASS: ${MINIO_PASS:?Set MINIO_PASS in .env}
    networks: [backend]

  # Web App (build locally: docker build -t plg-voice-web:latest ./client/)
  web:
    # Without this, `docker compose build web` (the command CLAUDE.md documents)
    # printed "No services to build" and exited 0 — which is how the deployed
    # bundle silently stayed on the 2026-05-17 build for two months.
    build:
      context: ./client
      dockerfile: Dockerfile
    image: plg-voice-web:latest
    logging: *default-logging
    <<: *default-hardening
    restart: always
    env_file: .env.web
    networks: [frontend]
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PLG Voice Admin Bot (moderation, XP, events, tournaments, etc.)
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    image: plg-voice-bot:latest
    logging: *default-logging
    <<: *default-hardening
    restart: always
    depends_on:
      api:
        condition: service_started
    # Explicit allowlist rather than `env_file: .env`: the bot only needs these
    # 10 of the 23 keys in .env, and handing it FILES_ENCRYPTION_KEY,
    # MESSAGES_ENCRYPTION_KEY, MONGO_PASS, MINIO_PASS, RABBIT_PASS and
    # REDIS_PASSWORD widened its blast radius for no reason.
    # PREFIX, SETTINGS_PATH and STREAM_PORT are deliberately absent — the bot
    # falls back to "!", data/settings.json and 3939 respectively.
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_URL: ${API_URL}
      WS_URL: ${WS_URL}
      PUBLIC_URL: ${PUBLIC_URL}
      SERVER_ID: ${SERVER_ID}
      WELCOME_CHANNEL: ${WELCOME_CHANNEL}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_WS_URL: ${LIVEKIT_PUBLIC_WS_URL}
    volumes:
      - ./data/bot:/app/data
    ports:
      # Expose the bot's stream service (HTTP) to the host so the nginx
      # reverse proxy in plgvoice.conf can reach /stream/* via 127.0.0.1:3939.
      - "127.0.0.1:3939:3939"
    networks: [frontend]
    deploy:
      resources:
        limits:
          memory: 256M
