<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!--
    Полдень social card. Paper, signal red, condensed capitals, and the
    amplitude meter as the mark — the same signature the app uses for a
    speaking user and every loading state.

    Type is drawn with a system condensed stack; whichever renderer produces
    the PNG falls through to a normal grotesque if it has none of them, which
    degrades to plain rather than wrong.
  -->
  <defs>
    <linearGradient id="wash" x1="600" y1="0" x2="600" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E00A45" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#E00A45" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#FBF9F7"/>
  <rect width="1200" height="630" fill="url(#wash)"/>

  <!-- Amplitude meter, baseline-aligned at y=250 -->
  <g fill="#E00A45">
    <rect x="527" y="212" width="10" height="38" rx="5"/>
    <rect x="551" y="178" width="10" height="72" rx="5"/>
    <rect x="575" y="150" width="10" height="100" rx="5"/>
    <rect x="599" y="190" width="10" height="60" rx="5"/>
    <rect x="623" y="164" width="10" height="86" rx="5"/>
    <rect x="647" y="204" width="10" height="46" rx="5"/>
    <rect x="671" y="184" width="10" height="66" rx="5"/>
  </g>

  <text x="600" y="378" text-anchor="middle"
        font-family="Bahnschrift, 'DIN Condensed', 'Archivo Narrow', 'Arial Narrow', Inter, system-ui, sans-serif"
        font-size="104" font-weight="700" fill="#16131C" letter-spacing="2">PLG VOICE</text>

  <text x="600" y="432" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="24" fill="#55505F" letter-spacing="0">Голосовой и текстовый мессенджер для геймеров</text>

  <rect x="524" y="524" width="152" height="2" fill="#E00A45" opacity="0.35"/>

  <text x="600" y="576" text-anchor="middle"
        font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace"
        font-size="17" fill="#8A8494" letter-spacing="4">PLGAMES-VOICE.RU</text>
</svg>
