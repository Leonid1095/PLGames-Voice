server {
    server_name plgames-voice.ru;

    # Hide nginx version from Server header and error pages.
    server_tokens off;

    client_max_body_size 100M;

    # Security headers. nginx owns these outright: it is the only hop every
    # request passes through, whereas /whip and /stream/ below go straight to
    # their backends without touching Caddy. Caddy therefore does NOT set them
    # — two layers setting the same headers produced duplicated (and, for
    # X-XSS-Protection, contradictory) values on every response.
    #
    # CAREFUL: nginx inherits add_header into a nested block only when that
    # block declares no add_header of its own. Any location that adds a header
    # must therefore repeat this whole set — see the static-asset block below.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # X-XSS-Protection is deprecated and can introduce vulnerabilities in old
    # browsers; the strong CSP above is the right control. Modern guidance is 0.
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "accelerometer=(), camera=(self), geolocation=(), gyroscope=(), microphone=(self), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'none'" always;

    # Allow .well-known for PWA/TWA verification
    location /.well-known/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }

    # Block access to hidden files (.git, .env, etc.) but allow .well-known
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Block WordPress scanner bots
    location ~* /wp-(admin|login|content|includes|json) {
        return 444;
    }
    location ~* /wordpress/ {
        return 444;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://127.0.0.1:8091/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # LiveKit WebSocket
    location /livekit {
        proxy_pass http://127.0.0.1:8091/livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # WHIP streaming endpoint (browser/OBS WebRTC ingest)
    location /whip {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stream viewer page.
    # `^~` matters: without it the static-asset regex location below wins for
    # anything under /stream/ ending in .js, and the viewer's own
    # /stream/livekit-client.js gets proxied to the web client and 404s.
    location ^~ /stream/ {
        proxy_pass http://127.0.0.1:3939;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching
    location ~* \.(js|css|woff2|woff|ttf|png|jpg|jpeg|gif|ico|svg|webp|wasm)$ {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Declaring Cache-Control above cancels inheritance of every
        # server-level add_header, so the security set has to be repeated here
        # verbatim or scripts, styles and images ship with no CSP at all.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "accelerometer=(), camera=(self), geolocation=(), gyroscope=(), microphone=(self), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' wss: https:; font-src 'self' data:; frame-ancestors 'none'" always;
    }

    # Everything else to Caddy
    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    # Pin TLS policy in-repo rather than trusting the Certbot include silently.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/letsencrypt/live/plgames-voice.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/plgames-voice.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = plgames-voice.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name plgames-voice.ru;
    server_tokens off;
    return 404; # managed by Certbot
}
