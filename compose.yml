name: plg-voice

# Default JSON log driver with rotation — prevents container logs from filling disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # MongoDB: Database
  database:
    image: docker.io/mongo:8
    logging: *default-logging
    restart: always
    command: --auth
    user: "999:999"
    volumes:
      - ./data/db:/data/db
    environment:
      MONGO_USER: ${MONGO_USER:-plgadmin}
      MONGO_PASS: ${MONGO_PASS:?Set MONGO_PASS in .env}
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: mongosh --norc --quiet -u $${MONGO_USER} -p $${MONGO_PASS} --authenticationDatabase admin --eval "db.runCommand({ping:1}).ok"
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis: Event message broker & KV store
  redis:
    image: docker.io/redis:7-alpine
    logging: *default-logging
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --tcp-keepalive 60
      --timeout 0
      --hz 10
      --tcp-backlog 511
      --activedefrag yes
      --save 3600 1
      --save 900 100
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite yes
      --client-output-buffer-limit pubsub 67108864 33554432 120
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      # Persist RDB + AOF across container recreation. Without this the
      # --appendonly/--save persistence has nowhere to write and every restart
      # wipes redis (cache/pubsub/presence).
      - ./data/redis:/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # RabbitMQ: Internal message broker
  rabbit:
    image: docker.io/rabbitmq:4
    logging: *default-logging
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-rabbituser}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:?Set RABBIT_PASS in .env}
    volumes:
      - ./data/rabbit:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MinIO: S3-compatible storage server
  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    logging: *default-logging
    command: server /data
    volumes:
      - ./data/minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioautumn}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:?Set MINIO_PASS in .env}
      MINIO_DOMAIN: minio
    networks:
      default:
        aliases:
          - revolt-uploads.minio
          - attachments.minio
          - avatars.minio
          - backgrounds.minio
          - icons.minio
          - banners.minio
          - emojis.minio
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  # Caddy: Web server
  caddy:
    image: docker.io/caddy:2
    logging: *default-logging
    restart: always
    env_file: .env.web
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # API server (local build with forum/threads support)
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.api
    image: plg-voice-api:latest
    logging: *default-logging
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/14702' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

  # Events service (local build)
  events:
    build:
      context: ./server
      dockerfile: Dockerfile.events
    image: plg-voice-events:latest
    logging: *default-logging
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/14703' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

  # File server
  autumn:
    image: plg-voice-autumn:latest
    logging: *default-logging
    depends_on:
      database:
        condition: service_healthy
      createbuckets:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/14704' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

  # Metadata and image proxy
  january:
    image: plg-voice-january:latest
    logging: *default-logging
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/14705' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: always

  # Regular task daemon
  crond:
    image: plg-voice-crond:latest
    logging: *default-logging
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always

  # Push notification daemon
  pushd:
    image: plg-voice-pushd:latest
    logging: *default-logging
    restart: always
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    deploy:
      resources:
        limits:
          memory: 256M

  # Voice ingress daemon
  voice-ingress:
    image: plg-voice-voice-ingress:latest
    logging: *default-logging
    restart: always
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - type: bind
        source: ./Revolt.toml
        target: /Revolt.toml
        read_only: true
    deploy:
      resources:
        limits:
          memory: 256M

  # Voice server
  livekit:
    image: plg-voice-livekit:v1.9.6
    logging: *default-logging
    command: --config /etc/livekit.yml
    volumes:
      - ./livekit.yml:/etc/livekit.yml:ro
      - ./data/livekit-certs/fullchain.pem:/etc/livekit/fullchain.pem:ro
      - ./data/livekit-certs/privkey.pem:/etc/livekit/privkey.pem:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "50000-50100:50000-50100/udp"
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7880/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  # LiveKit Ingress: RTMP/WHIP streaming (OBS etc.)
  livekit-ingress:
    image: livekit/ingress:v1.4.3
    logging: *default-logging
    restart: always
    depends_on:
      - livekit
      - redis
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress.yml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
    volumes:
      - ./ingress.yml:/etc/ingress.yml:ro
    ports:
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8088:8088"
    deploy:
      resources:
        limits:
          memory: 512M

  # LiveKit Egress: stream recording
  livekit-egress:
    image: livekit/egress:v1.12.0
    logging: *default-logging
    restart: always
    depends_on:
      - livekit
      - redis
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
    volumes:
      - ./egress.yml:/etc/egress.yml:ro
      - ./data/recordings:/recordings
    cap_add:
      - SYS_ADMIN
    deploy:
      resources:
        limits:
          memory: 1G

  # Create buckets for minio.
  createbuckets:
    image: docker.io/minio/mc:RELEASE.2025-09-07T16-13-09Z
    logging: *default-logging
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc ready minio; do
        /usr/bin/mc alias set minio http://minio:9000 $${MINIO_USER:-minioautumn} $${MINIO_PASS};
        echo 'Waiting minio...' && sleep 1;
      done;
      /usr/bin/mc mb minio/revolt-uploads;
      exit 0;
      "
    environment:
      MINIO_USER: ${MINIO_USER:-minioautumn}
      MINIO_PASS: ${MINIO_PASS:?Set MINIO_PASS in .env}

  # Web App (build locally: docker build -t plg-voice-web:latest ./client/)
  web:
    image: plg-voice-web:latest
    logging: *default-logging
    restart: always
    env_file: .env.web
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # PLG Voice Admin Bot (moderation, XP, events, tournaments, etc.)
  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    image: plg-voice-bot:latest
    logging: *default-logging
    restart: always
    depends_on:
      api:
        condition: service_started
    # Explicit allowlist rather than `env_file: .env`: the bot only needs these
    # 10 of the 23 keys in .env, and handing it FILES_ENCRYPTION_KEY,
    # MESSAGES_ENCRYPTION_KEY, MONGO_PASS, MINIO_PASS, RABBIT_PASS and
    # REDIS_PASSWORD widened its blast radius for no reason.
    # PREFIX, SETTINGS_PATH and STREAM_PORT are deliberately absent — the bot
    # falls back to "!", data/settings.json and 3939 respectively.
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_URL: ${API_URL}
      WS_URL: ${WS_URL}
      PUBLIC_URL: ${PUBLIC_URL}
      SERVER_ID: ${SERVER_ID}
      WELCOME_CHANNEL: ${WELCOME_CHANNEL}
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_PUBLIC_WS_URL: ${LIVEKIT_PUBLIC_WS_URL}
    volumes:
      - ./data/bot:/app/data
    ports:
      # Expose the bot's stream service (HTTP) to the host so the nginx
      # reverse proxy in plgvoice.conf can reach /stream/* via 127.0.0.1:3939.
      - "127.0.0.1:3939:3939"
    deploy:
      resources:
        limits:
          memory: 256M
